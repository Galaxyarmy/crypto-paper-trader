name: Crypto Paper Trading Agent

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Prevents overlapping runs — if a run is still going when the next
# scheduled trigger fires, the new one waits instead of running in
# parallel (which is what caused the push conflict).
concurrency:
  group: trading-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # safety net: kill the job if it ever hangs again
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run trading agent
        run: python paper_trader.py

      - name: Commit updated state
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add state.json trade_log_v6.csv
          git diff --quiet --cached || git commit -m "Update paper trading state [skip ci]"
          # Pull any changes that landed between our checkout and now,
          # then push. If nothing changed, this is a no-op.
          git pull --rebase origin main
          git push
